name: Build GrindrX iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Compile & Package GrindrX IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 15/16
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild -project Grindr.xcodeproj \
            -scheme Grindr \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Grindr.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Grindr.xcarchive/Products/Applications/Grindr.app Payload/
          zip -r GrindrX.ipa Payload
          ls -lh GrindrX.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrindrX-iOS-IPA
          path: GrindrX.ipa
          retention-days: 14

      - name: Create Automatic Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: GrindrX Sovereign Release
          body: |
            ### GrindrX Sovereign iOS Client
            * Compiled via native Apple Silicon macOS runner
            * Ready for Sideloadly / AltStore / Xcode signing with paid developer certificate
          files: GrindrX.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
